services:
  ecs:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: opsdeck-ecs:latest
    container_name: "${CONTAINER_NAME:-ecs}"
    restart: unless-stopped
    ports:
      # 默认监听所有网卡 43211（局域网可访问）；只需本机访问可 PORT=127.0.0.1:43211
      - "${PORT:-0.0.0.0:43211}:80"
    environment:
      TZ: Asia/Shanghai
      CRON_INTERVAL: "${CRON_INTERVAL:-60}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      # 宿主机只需一个 data 目录：映射为容器内的 storage（数据库、密钥、日志全部在这里）
      - ./data:/var/www/ecs/storage
